  /v1/home:
    get:
      operationId: getHome
      summary: Composição limitada de descoberta pública
      description: >-
        Sessão ativa. PUBLIC/PUBLISHED/VISIBLE, ends_at > as_of, via visão Experiences.
        Sem coordenadas, descoberta geral e nearby locality_required. Categoria habilitada
        filtra apenas contextual. Sem afinidade/histórico/popularidade/editorial implícitos.
        Seis seções fixas; falha de dependência retorna erro global, nunca sucesso parcial.
        Sem cursor/total; até 1+5*limit cards, máximo 41, catálogo até 100 categorias e JSON até 2MiB. Até duas ocorrências por ID,
        alocadas na ordem highlights/live/soon/nearby/contextual/recent; vazios podem
        resultar da deduplicação. Ordenação informada por seção. Atualizar em refresh_at
        (menor entre 60s e próxima fronteira temporal retornada), no retorno/resume e manualmente.
        Não há snapshot persistente nem cache; alterações remotas aparecem na revalidação.
        Query duplicada, vazia ou desconhecida é 400; parâmetros geográficos são transitórios.
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: latitude
        description: 'Centro aproximado de região selecionada; arredondado a duas casas no servidor. Exige longitude.'
        schema:
          type: number
          minimum: -90
          maximum: 90
      - in: query
        name: longitude
        description: 'Exige latitude. Não é obtida do GPS.'
        schema:
          type: number
          minimum: -180
          maximum: 180
      - in: query
        name: radius_m
        description: 'Raio; requer par latitude/longitude. Default HOME_RADIUS_M, 25000.'
        schema:
          type: integer
          minimum: 1000
          maximum: 100000
      - in: query
        name: limit
        description: 'Teto por seção; default e máximo efetivo HOME_SECTION_LIMIT, 6; highlights até 1.'
        schema:
          type: integer
          minimum: 1
          maximum: 8
      - in: query
        name: category_id
        description: Categoria habilitada para descoberta contextual; não é preferência persistida.
        schema:
          type: string
          maxLength: 40
      responses:
        '200':
          description: Home; seções vazias são ocultadas pelo cliente, nearby pode solicitar localidade.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Home'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '429':
