components:
  responses:
    Error:
      description: Erro sanitizado, incluindo método ou corpo não permitido
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: Quota ou cooldown atingido. Não repetir automaticamente. Retry-After é conservador; respeitar
        também expires_at/cooldown.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  headers:
    RequestID:
      description: Correlação opaca, sem identidade de usuário
      schema:
        type: string
        minLength: 8
        maxLength: 64
        pattern: ^[A-Za-z0-9_-]+$
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Credencial opaca de acesso Flow. Estado da sessão e status da conta sempre verificados no PostgreSQL.
      bearerFormat: opaque
  schemas:
    ExplorePage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/Experience'
        next_cursor:
          type: string
          nullable: true
        as_of: &pr05schema001
          type: string
          format: date-time
        valid_until: *pr05schema001
      required:
      - items
      - next_cursor
      - as_of
      - valid_until
    FlowItem:
      type: object
      additionalProperties: false
      properties:
        experience:
          $ref: '#/components/schemas/Experience'
        presentation_version:
          type: integer
          minimum: 0
        image_kind:
          type: string
          enum:
          - image
          - poster
          - cover
        has_video:
          type: boolean
        duration_ms:
          type: integer
          minimum: 1
          maximum: 15000
          nullable: true
        image_url:
          type: string
        video_url:
          type: string
          nullable: true
        media_expires_at: *pr05schema001
      required:
      - experience
      - presentation_version
      - image_kind
      - has_video
      - duration_ms
      - image_url
      - video_url
      - media_expires_at
    FlowsPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/FlowItem'
        next_cursor:
          type: string
          nullable: true
        as_of: *pr05schema001
        valid_until: *pr05schema001
        window_hours:
          type: integer
          minimum: 1
          maximum: 168
      required:
      - items
      - next_cursor
      - as_of
      - valid_until
      - window_hours
    FlowPresentationInput:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        unlisted_consent:
          type: boolean
          default: false
        image_asset_id: &pr05schema002
          type: string
          format: uuid
          nullable: true
        video_asset_id: *pr05schema002
      required:
      - enabled
    FlowPresentation:
      type: object
      additionalProperties: false
      properties:
        experience_id: &pr05schema003
          type: string
          format: uuid
        enabled:
          type: boolean
        unlisted_consent_at:
          type: string
          format: date-time
          nullable: true
        image_asset_id: *pr05schema002
        video_asset_id: *pr05schema002
        version:
          type: integer
          minimum: 0
      required:
      - experience_id
      - enabled
      - unlisted_consent_at
      - image_asset_id
      - video_asset_id
      - version
    FlowUploadInput:
      type: object
      additionalProperties: false
      properties:
        content_type:
          type: string
          enum:
          - image/jpeg
          - image/png
          - video/mp4
          - video/quicktime
        size_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 33554432
      required:
      - content_type
      - size_bytes
    FlowAsset:
      type: object
      additionalProperties: false
      properties:
        id: *pr05schema003
        experience_id: *pr05schema003
        status:
          type: string
          enum:
          - UPLOADING
          - PROCESSING
          - READY
          - FAILED
          - DELETED
        content_type:
          type: string
          enum:
          - image/jpeg
          - image/png
          - video/mp4
          - video/quicktime
        size_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 33554432
        width:
          type: integer
          nullable: true
          minimum: 1
          maximum: 4096
        height:
          type: integer
          nullable: true
          minimum: 1
          maximum: 4096
        duration_ms:
          type: integer
          nullable: true
          minimum: 1
          maximum: 15000
        failure_code:
          type: string
          nullable: true
          enum:
          - invalid_media
          - processing_failed
          - expired
      required:
      - id
      - experience_id
      - status
      - content_type
      - size_bytes
      - width
      - height
      - duration_ms
      - failure_code
    ExperienceInput:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 5000
        category_id:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,39}$
          nullable: true
        visibility:
          type: string
          enum:
          - PUBLIC
          - UNLISTED
          - PRIVATE
          default: PRIVATE
        starts_at:
          type: string
          format: date-time
          nullable: true
        ends_at:
          type: string
          format: date-time
          nullable: true
        timezone:
          type: string
          maxLength: 100
          description: IANA explícito (UTC permitido). Local/offsets abreviados não aceitos.
          nullable: true
        location:
          type: object
          additionalProperties: false
          properties:
            latitude:
              type: number
              format: double
              minimum: -90
              maximum: 90
            longitude:
              type: number
              format: double
              minimum: -180
              maximum: 180
          required:
          - latitude
          - longitude
          nullable: true
        venue_name:
          type: string
          maxLength: 160
        address:
          type: string
          maxLength: 300
        capacity:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000000
          nullable: true
        external_ticket_url:
          type: string
          format: uri
          maxLength: 2048
          description: HTTPS, DNS ASCII/punycode, sem credenciais/fragmento/IP/porta não padrão. Sem fetch ou pagamento
            Flow.
          nullable: true
        cover_media_id:
          type: string
          format: uuid
          nullable: true
      description: 'POST aceita rascunho parcial. PUT substitui todos os campos editáveis: omissão limpa campos/defaults.
        Tempo RFC3339 com offset UTC; saída em Z. null limpa opcionais; strings vazias permitidas no draft. Agenda/local/categoria/capacidade/visibilidade
        imutáveis após publicação.'
    Experience:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 5000
        category_id:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,39}$
          nullable: true
        visibility:
