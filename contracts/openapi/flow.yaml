components:
  responses:
    Error:
      description: Erro sanitizado, incluindo método ou corpo não permitido
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: Quota ou cooldown atingido. Não repetir automaticamente. Retry-After é conservador; respeitar
        também expires_at/cooldown.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  headers:
    RequestID:
      description: Correlação opaca, sem identidade de usuário
      schema:
        type: string
        minLength: 8
        maxLength: 64
        pattern: ^[A-Za-z0-9_-]+$
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Credencial opaca de acesso Flow. Estado da sessão e status da conta sempre verificados no PostgreSQL.
      bearerFormat: opaque
  schemas:
    ExperienceInput:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 5000
        category_id:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,39}$
          nullable: true
        visibility:
          type: string
          enum:
          - PUBLIC
          - UNLISTED
          - PRIVATE
          default: PRIVATE
        starts_at:
          type: string
          format: date-time
          nullable: true
        ends_at:
          type: string
          format: date-time
          nullable: true
        timezone:
          type: string
          maxLength: 100
          description: IANA explícito (UTC permitido). Local/offsets abreviados não aceitos.
          nullable: true
        location:
          type: object
          additionalProperties: false
          properties:
            latitude:
              type: number
              format: double
              minimum: -90
              maximum: 90
            longitude:
              type: number
              format: double
              minimum: -180
              maximum: 180
          required:
          - latitude
          - longitude
          nullable: true
        venue_name:
          type: string
          maxLength: 160
        address:
          type: string
          maxLength: 300
        capacity:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000000
          nullable: true
        external_ticket_url:
          type: string
          format: uri
          maxLength: 2048
          description: HTTPS, DNS ASCII/punycode, sem credenciais/fragmento/IP/porta não padrão. Sem fetch ou pagamento
            Flow.
          nullable: true
        cover_media_id:
          type: string
          format: uuid
          nullable: true
      description: 'POST aceita rascunho parcial. PUT substitui todos os campos editáveis: omissão limpa campos/defaults.
        Tempo RFC3339 com offset UTC; saída em Z. null limpa opcionais; strings vazias permitidas no draft. Agenda/local/categoria/capacidade/visibilidade
        imutáveis após publicação.'
    Experience:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 5000
        category_id:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,39}$
          nullable: true
        visibility:
          type: string
          enum:
          - PUBLIC
          - UNLISTED
          - PRIVATE
          default: PRIVATE
        starts_at:
          type: string
          format: date-time
          nullable: true
        ends_at:
          type: string
          format: date-time
          nullable: true
        timezone:
          type: string
          maxLength: 100
          description: IANA explícito (UTC permitido). Local/offsets abreviados não aceitos.
          nullable: true
        location:
          type: object
          additionalProperties: false
          properties:
            latitude:
              type: number
              format: double
              minimum: -90
              maximum: 90
            longitude:
              type: number
              format: double
              minimum: -180
              maximum: 180
          required:
          - latitude
          - longitude
          nullable: true
        venue_name:
          type: string
          maxLength: 160
        address:
          type: string
          maxLength: 300
        capacity:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000000
          nullable: true
        external_ticket_url:
          type: string
          format: uri
          maxLength: 2048
          description: HTTPS, DNS ASCII/punycode, sem credenciais/fragmento/IP/porta não padrão. Sem fetch ou pagamento
            Flow.
          nullable: true
        cover_media_id:
          type: string
          format: uuid
          nullable: true
        id:
          type: string
          format: uuid
        creator_user_id:
          type: string
          format: uuid
        location_type:
          type: string
          enum:
          - PHYSICAL
        status:
          type: string
          enum:
          - DRAFT
          - PUBLISHED
          - CANCELLED
          - ARCHIVED
        phase:
          type: string
          enum:
          - UPCOMING
          - LIVE
          - ENDED
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        published_at:
          type: string
          format: date-time
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        archived_at:
          type: string
          format: date-time
          nullable: true
        version:
          type: integer
          format: int64
          minimum: 1
        details_redacted:
          type: boolean
      required:
      - title
      - description
      - category_id
      - visibility
      - starts_at
      - ends_at
      - timezone
      - location
      - venue_name
      - address
      - capacity
      - external_ticket_url
      - cover_media_id
      - id
      - creator_user_id
      - location_type
      - status
      - phase
      - created_at
      - updated_at
      - published_at
      - cancelled_at
      - archived_at
      - version
      - details_redacted
      description: 'Sem dados Identity privados. PRIVATE e drafts: somente autor. PUBLIC/UNLISTED publicados: acesso
        direto autenticado. Histórico não autor é redigido: details_redacted=true, description/venue_name/address vazios
        e location/capacity/ticket/cover nulos. phase é derivado só para PUBLISHED.'
    ExperiencePage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Experience'
        next_cursor:
          type: string
          maxLength: 2048
          nullable: true
      required:
      - items
      - next_cursor
    ExperienceCategory:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        sort_order:
          type: integer
          format: int32
      required:
      - id
      - name
      - sort_order
    ExperienceCategories:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExperienceCategory'
      required:
      - items
    CoverUploadInput:
      type: object
      additionalProperties: false
      properties:
        content_type:
          type: string
          enum:
          - image/jpeg
          - image/png
        size_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 5242880
      required:
      - content_type
      - size_bytes
    CoverUpload:
      type: object
      additionalProperties: false
      properties:
        media_id:
          type: string
          format: uuid
        upload:
          type: object
          additionalProperties: false
          properties:
            method:
              type: string
              enum:
              - POST
            url:
              type: string
              format: uri
            fields:
              type: object
              additionalProperties:
                type: string
            expires_at:
              type: string
              format: date-time
          required:
          - method
          - url
          - fields
          - expires_at
      required:
      - media_id
      - upload
    CoverVerified:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - READY
        content_type:
          type: string
          enum:
          - image/jpeg
          - image/png
        size_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 5242880
        width:
          type: integer
          minimum: 1
          maximum: 4096
        height:
          type: integer
          minimum: 1
          maximum: 4096
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
      required:
      - id
      - status
      - content_type
      - size_bytes
      - width
      - height
      - sha256
    EmptyTransition:
      type: object
      additionalProperties: false
      properties: {}
      required: []
    ErrorEnvelope:
      type: object
      required:
      - error
      additionalProperties: false
      properties:
        error:
          type: object
          required:
          - code
          - message
          - request_id
          additionalProperties: false
          properties:
            code:
              type: string
              description: 'Códigos estáveis: invalid_request, invalid_credential, unauthorized, account_restricted,
                reauthentication_required, identity_conflict, last_identity, handle_unavailable, onboarding_already_completed,
                session_limit, rate_limited, provider_unavailable, temporarily_unavailable, payload_too_large, onboarding_required, experience_invalid, invalid_transition, protected_attributes, version_conflict, precondition_required, idempotency_conflict, draft_limit, publishing_restricted, media_invalid, media_not_ready, upload_not_pending, upload_expired, media_unavailable.'
            message:
              type: string
            request_id:
              type: string
    Device:
      type: object
      additionalProperties: false
      required:
      - platform
      - app_version
      properties:
        platform:
          type: string
          enum:
          - android
          - ios
        app_version:
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^[0-9A-Za-z.+_-]+$
        label:
          type: string
          maxLength: 80
    PhoneChallengeRequest:
      type: object
      additionalProperties: false
      required:
      - phone
      - purpose
      properties:
        phone:
          type: string
          minLength: 8
          maxLength: 40
          description: Formato internacional iniciado em +; normalizado e validado por libphonenumber. Países permitidos
            por configuração.
        purpose: &id002
          type: string
          enum:
          - login
          - link
          - reauth
    OIDCChallengeRequest:
      type: object
      additionalProperties: false
      required:
      - provider
      - purpose
      properties:
        provider:
          type: string
          enum:
          - GOOGLE
          - APPLE
        purpose: *id002
    Challenge:
      type: object
      additionalProperties: false
      required:
      - challenge_id
      - expires_at
      - resend_after_seconds
      properties:
        challenge_id: *id001
        expires_at: &id003
          type: string
          format: date-time
        resend_after_seconds:
          type: integer
          minimum: 0
        nonce:
          type: string
          minLength: 32
          maxLength: 256
          description: Usar exatamente como retornado no request ao provedor. Apple já recebe nonce SHA-256 em hexadecimal;
            não aplicar outro hash.
    PhoneVerifyRequest:
      type: object
      additionalProperties: false
      required:
      - challenge_id
      - code
      - device
      properties:
        challenge_id: *id001
        code:
          type: string
          pattern: ^[0-9]{4,10}$
          writeOnly: true
        device:
          $ref: '#/components/schemas/Device'
    OIDCLoginRequest:
      type: object
      additionalProperties: false
      required:
      - challenge_id
      - id_token
      - device
      properties:
        challenge_id: *id001
        id_token:
          type: string
          minLength: 1
          maxLength: 16384
          writeOnly: true
        device:
          $ref: '#/components/schemas/Device'
    ProviderProof:
      type: object
      additionalProperties: false
      required:
      - provider
      - challenge_id
      - credential
      properties:
        provider: &id004
          type: string
          enum:
          - PHONE
          - GOOGLE
          - APPLE
        challenge_id: *id001
        credential:
          type: string
          minLength: 1
          maxLength: 16384
          writeOnly: true
          description: OTP para PHONE ou ID token para GOOGLE/APPLE. Nunca um subject informado pelo cliente.
    Tokens:
      type: object
      additionalProperties: false
      required:
      - access_token
      - token_type
      - expires_in
      - refresh_token
      - session_id
      - session_expires_at
      properties:
        access_token:
          type: string
          writeOnly: false
          pattern: ^fa_[A-Za-z0-9_-]{43}$
        token_type:
          type: string
          enum:
          - Bearer
        expires_in:
          type: integer
          minimum: 1
        refresh_token:
          type: string
          pattern: ^fr_[0-9a-f-]{36}\.[A-Za-z0-9_-]{43}$
        session_id: *id001
        session_expires_at: *id003
    Profile:
