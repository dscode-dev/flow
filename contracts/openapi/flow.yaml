        id:
          type: string
          format: uuid
        creator_user_id:
          type: string
          format: uuid
        location_type:
          type: string
          enum:
          - PHYSICAL
        status:
          type: string
          enum:
          - DRAFT
          - PUBLISHED
          - CANCELLED
          - ARCHIVED
        phase:
          type: string
          enum:
