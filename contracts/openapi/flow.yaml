openapi: 3.0.3
info:
  title: Flow API
  version: 1.4.0
  description: 'Identity por PHONE, GOOGLE e APPLE; Experiences e capas S3 verificadas. Credenciais opacas Flow,
    sem senha. Provedores/storage sem configuração retornam 503; nenhuma homologação externa é presumida.'
servers:
- url: /
paths:
  /healthz:
    get:
      operationId: health
      security: []
      summary: Liveness do processo, independente das dependências
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: Processo vivo
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                additionalProperties: false
                properties:
                  status:
                    type: string
                    enum:
                    - alive
  /readyz:
    get:
      operationId: readiness
      security: []
      summary: PostgreSQL, Redis e RabbitMQ acessíveis; falso durante encerramento
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: Pronto
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                additionalProperties: false
                properties:
                  status:
                    type: string
                    enum:
                    - ready
        '503':
          description: Dependência indisponível ou encerramento
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/auth/phone/challenges:
    post:
      operationId: requestPhoneChallenge
      summary: Solicita SMS real
      description: 'Solicita SMS real. login é público; link/reauth exigem sessão; link exige autenticação recente.
        Reenvio usa nova solicitação após cooldown e invalida desafio anterior. Não revela existência da conta.
        Sem idempotência de entrega: não repetir automaticamente após timeout; aguardar cooldown. Quotas por número/origem/global
        persistidas antes do envio.'
      security:
      - {}
      - bearerAuth: []
      responses:
        '201':
          description: Operação concluída
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneChallengeRequest'
  /v1/auth/oidc/challenges:
    post:
      operationId: requestOIDCChallenge
      summary: Cria nonce de uso único ligado ao provedor e finalidade
      description: Cria nonce de uso único ligado ao provedor e finalidade. login é público; link/reauth exigem
        sessão; link exige autenticação recente. Novo challenge por tentativa, sem reutilização.
      security:
      - {}
      - bearerAuth: []
      responses:
        '201':
          description: Operação concluída
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OIDCChallengeRequest'
  /v1/auth/phone/verify:
    post:
      operationId: phoneLogin
      summary: Consome uma vez desafio login e OTP aprovado pelo Twilio Verify
      description: Consome uma vez desafio login e OTP aprovado pelo Twilio Verify. Cadastro e login retornam o
        mesmo modelo. Não repetir após resposta perdida; iniciar nova prova. Número nunca é enviado em URL ou resposta.
      security: []
      responses:
        '200':
          description: Operação concluída
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneVerifyRequest'
  /v1/auth/google:
    post:
      operationId: googleLogin
      summary: Valida RS256, chaves Google confiáveis, issuer, audience/azp aprovado, exp/iat e nonce do desafio
        login
      description: Valida RS256, chaves Google confiáveis, issuer, audience/azp aprovado, exp/iat e nonce do desafio
        login. Usa sub, sem exigir telefone. Desafio de uso único; repetir com novo desafio após falha ambígua.
      security: []
      responses:
        '200':
          description: Operação concluída
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OIDCLoginRequest'
  /v1/auth/apple:
    post:
      operationId: appleLogin
      summary: Valida ID token Apple nativo com assinatura, issuer, audience, exp/iat e nonce
      description: Valida ID token Apple nativo com assinatura, issuer, audience, exp/iat e nonce. Não recebe authorization
        code e não troca código neste fluxo. Usa sub, ignora e-mail/relay e nome. Sem exigência de telefone. Desafio
        de uso único.
      security: []
      responses:
        '200':
          description: Operação concluída
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OIDCLoginRequest'
  /v1/auth/refresh:
    post:
      operationId: refreshSession
      summary: 'Rotação estrita: cada refresh só pode ser usado uma vez'
      description: 'Rotação estrita: cada refresh só pode ser usado uma vez. Reuso com segredo correto revoga a
        família/sessão, incluindo o novo access. Não idempotente: cliente deve usar single-flight e nunca repetir
        refresh antigo após timeout. PostgreSQL autoritativo; Redis não afeta validação/revogação.'
      security: []
      responses:
        '200':
          description: Operação concluída
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
  /v1/auth/logout:
    post:
      operationId: logout
      summary: Revoga a sessão atual
      description: Revoga a sessão atual. Repetição com credencial já revogada retorna 401; cliente trata 401 como
        saída concluída e limpa armazenamento.
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Operação concluída
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/reauthenticate:
    post:
      operationId: reauthenticate
      summary: Confirma controle de identidade já vinculada por desafio reauth ligado à sessão
      description: Confirma controle de identidade já vinculada por desafio reauth ligado à sessão. Atualiza autenticação
        recente sem emitir outra sessão. Não aceitar identidade de outra conta ou finalidade link/login.
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Operação concluída
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderProof'
  /v1/me:
    get:
      operationId: getMe
      summary: Perfil mínimo e estado explícito de onboarding
      description: Perfil mínimo e estado explícito de onboarding. Conta suspensa/desabilitada/deletada recebe account_restricted.
        Nenhum telefone, e-mail, token ou subject de provedor retornado.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Operação concluída
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/me/onboarding:
    patch:
      operationId: completeOnboarding
      summary: Completa perfil inicial uma única vez
      description: Completa perfil inicial uma única vez. Repetição normalizada idêntica é idempotente; alteração
        posterior recebe onboarding_already_completed. Handle lowercase ASCII único e reservado; indisponibilidade
        gera handle_unavailable.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Operação concluída
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingRequest'
  /v1/me/sessions:
    get:
      operationId: listSessions
      summary: Lista todas as sessões ativas até limite configurado de 20
      description: Lista todas as sessões ativas até limite configurado de 20. Não expõe hashes ou IDs de hardware.
        device label é dado opcional fornecido pela pessoa, sem prova de posse.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Operação concluída
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/me/sessions/{sessionId}:
    delete:
      operationId: revokeSession
      summary: Revoga somente sessão da conta atual, sem revelar sessões de terceiros
      description: Revoga somente sessão da conta atual, sem revelar sessões de terceiros. Idempotente enquanto
        a sessão chamadora continuar válida. Sessão de outro dispositivo exige autenticação recente.
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Operação concluída
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - name: sessionId
        in: path
        required: true
        schema: &id001
          type: string
          format: uuid
  /v1/me/sessions/revoke-all:
    post:
      operationId: revokeAllSessions
      summary: Revoga todas as sessões inclusive a atual; exige autenticação recente
      description: Revoga todas as sessões inclusive a atual; exige autenticação recente. Repetição com credencial
        revogada recebe 401, sem efeito adicional.
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Operação concluída
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/me/identities:
    get:
      operationId: listIdentities
      summary: Lista métodos vinculados utilizáveis, sem telefone/e-mail ou subject
      description: Lista métodos vinculados utilizáveis, sem telefone/e-mail ou subject. Identidades revogadas não
        aparecem.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Operação concluída
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityList'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/me/identities/link:
    post:
      operationId: linkIdentity
      summary: Exige sessão válida, autenticação recente e desafio link independente vinculado à sessão
      description: Exige sessão válida, autenticação recente e desafio link independente vinculado à sessão. Conflito
        de dono retorna identity_conflict sem dados da outra conta. Vínculo já existente do mesmo dono e repetição
        do desafio consumido são idempotentes. Não transfere identidade ou mescla e-mails.
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Operação concluída
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderProof'
  /v1/me/identities/{identityId}:
    delete:
      operationId: unlinkIdentity
      summary: Exige autenticação recente e preserva ao menos outro método disponível
      description: Exige autenticação recente e preserva ao menos outro método disponível. Idempotente; não revela
        identidade de terceiros. Mantém reserva de ownership como tombstone até política de privacidade/recovery
        aprovada.
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Operação concluída
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - name: identityId
        in: path
        required: true
        schema: *id001
  /v1/auth/apple/notifications:
    post:
      operationId: appleNotification
      summary: Webhook público somente com JWS Apple válido
      description: Webhook público somente com JWS Apple válido. Deduplicação por jti. consent-revoked/account-deleted
        revogam identidade e todas as sessões Flow; eventos de relay não alteram identidade. Notificações sem exp
        seguem formato documentado pela Apple com janela iat de sete dias.
      security: []
      responses:
        '204':
          description: Operação concluída
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppleNotification'
  /v1/experience-categories:
    get:
      operationId: listExperienceCategories
      summary: Catálogo habilitado persistido
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Operação concluída
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperienceCategories'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
  /v1/radar/experiences:
    get:
      operationId: radarExperiences
      summary: Marcadores públicos elegíveis no viewport
      description: >-
        Reutiliza experiences.discovery. PUBLIC/PUBLISHED/VISIBLE e ends_at > as_of.
        Bbox inclusiva west,south,east,north; west > east cruza o antimeridiano.
        Latitude Mercator limitada a +/-85.051129. Zoom0..22; abaixo de RADAR_MIN_ZOOM
        (default4), amplitude maior que RADAR_MAX_SPAN_DEGREES (default30, máximo60)
        retorna400 radar_area_too_large; não há consulta global irrestrita.
        Ordenação starts_at/id ASC. limit padrão100, teto configurado RADAR_RESULT_LIMIT
        até200. Busca limit+1 e informa truncated; sem total/cursor, aproximar/refinar
        para outros candidatos. Clusters no cliente contam somente estes itens.
        Período opcional from/until UTC, intervalo semiaberto de até31 dias:
        starts_at < until e ends_at > from, preservando exclusão dos já encerrados.
        Distância requer latitude/longitude/radius_m juntos; centro arredondado a2 casas.
        Query até2048 bytes, JSON até1MiB, statement timeout via contexto2s, no-store.
        valid_until marca o vencimento (até60s ou próxima fronteira temporal);
        cliente descarta pins vencidos e oferece atualização, sem polling contínuo.
        Erros não indicam existência privada. Parâmetros vazios/duplicados/desconhecidos
        ou não finitos são400; sem cache ou persistência de histórico de câmera.
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: bbox
        required: true
        description: west,south,east,north em graus; amplitude limitada e antimeridiano suportado.
        schema:
          type: string
          maxLength: 120
      - in: query
        name: zoom
        required: true
        schema:
          type: number
          minimum: 0
          maximum: 22
