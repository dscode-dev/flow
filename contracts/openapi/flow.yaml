          nullable: true
        venue_name:
          type: string
          maxLength: 160
        address:
          type: string
          maxLength: 300
        capacity:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000000
          nullable: true
        external_ticket_url:
          type: string
          format: uri
          maxLength: 2048
          description: HTTPS, DNS ASCII/punycode, sem credenciais/fragmento/IP/porta não padrão. Sem fetch ou pagamento
            Flow.
          nullable: true
        cover_media_id:
          type: string
          format: uuid
          nullable: true
        id:
          type: string
          format: uuid
        creator_user_id:
          type: string
          format: uuid
        location_type:
          type: string
          enum:
          - PHYSICAL
        status:
          type: string
          enum:
          - DRAFT
          - PUBLISHED
          - CANCELLED
          - ARCHIVED
        phase:
          type: string
          enum:
