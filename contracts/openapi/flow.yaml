          maximum: 168
        section_limit:
          type: integer
          minimum: 1
          maximum: 8
        locality:
          type: object
          nullable: true
          additionalProperties: false
          required: [latitude, longitude, radius_m]
          properties:
            latitude:
              type: number
              minimum: -90
              maximum: 90
            longitude:
              type: number
              minimum: -180
              maximum: 180
            radius_m:
              type: integer
              minimum: 1000
              maximum: 100000
        category_id:
          type: string
          nullable: true
        categories:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ExperienceCategory'
        sections:
          type: array
          minItems: 6
          maxItems: 6
          items:
            $ref: '#/components/schemas/HomeSection'
    HomeSection:
      type: object
      additionalProperties: false
      required: [id, order, availability, items]
      properties:
        id:
          type: string
          enum: [highlights, live, soon, nearby, contextual, recent]
        order:
          type: string
          enum: [starts_at_asc_id_asc, starts_at_desc_id_desc, distance_asc_starts_at_asc_id_asc, starts_at_asc_created_at_desc_id_asc, created_at_desc_id_desc]
        availability:
          type: string
          enum: [available, empty, locality_required]
        items:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/HomeItem'
    HomeItem:
      type: object
      additionalProperties: false
      required: [experience, category_name, distance_m]
      properties:
        experience:
          $ref: '#/components/schemas/Experience'
        category_name:
          type: string
        distance_m:
          type: integer
          nullable: true
          minimum: 0
          description: Distância geodésica ao centro aproximado, arredondada a 100m; apenas nearby.
    ExperiencePage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Experience'
        next_cursor:
          type: string
          maxLength: 2048
          nullable: true
      required:
      - items
      - next_cursor
    ExperienceCategory:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        sort_order:
          type: integer
          format: int32
      required:
      - id
      - name
      - sort_order
    ExperienceCategories:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExperienceCategory'
      required:
      - items
    CoverUploadInput:
      type: object
      additionalProperties: false
      properties:
        content_type:
          type: string
          enum:
          - image/jpeg
          - image/png
        size_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 5242880
      required:
      - content_type
      - size_bytes
    CoverUpload:
      type: object
      additionalProperties: false
      properties:
        media_id:
          type: string
          format: uuid
        upload:
          type: object
          additionalProperties: false
          properties:
            method:
              type: string
              enum:
              - POST
            url:
              type: string
              format: uri
            fields:
              type: object
              additionalProperties:
                type: string
            expires_at:
              type: string
              format: date-time
          required:
          - method
          - url
          - fields
          - expires_at
      required:
      - media_id
      - upload
    CoverVerified:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - READY
        content_type:
          type: string
          enum:
          - image/jpeg
          - image/png
        size_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 5242880
        width:
          type: integer
          minimum: 1
          maximum: 4096
        height:
          type: integer
          minimum: 1
          maximum: 4096
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
      required:
      - id
      - status
      - content_type
      - size_bytes
      - width
      - height
      - sha256
    EmptyTransition:
      type: object
      additionalProperties: false
      properties: {}
      required: []
    ErrorEnvelope:
      type: object
      required:
      - error
      additionalProperties: false
      properties:
        error:
          type: object
          required:
          - code
          - message
          - request_id
          additionalProperties: false
          properties:
            code:
              type: string
              description: 'Códigos estáveis: invalid_request, invalid_credential, unauthorized, account_restricted,
                reauthentication_required, identity_conflict, last_identity, handle_unavailable, onboarding_already_completed,
                session_limit, rate_limited, provider_unavailable, temporarily_unavailable, payload_too_large, onboarding_required, experience_invalid, invalid_transition, protected_attributes, version_conflict, precondition_required, idempotency_conflict, draft_limit, publishing_restricted, media_invalid, media_not_ready, upload_not_pending, upload_expired, media_unavailable.'
            message:
              type: string
            request_id:
              type: string
    Device:
      type: object
      additionalProperties: false
      required:
      - platform
      - app_version
      properties:
        platform:
          type: string
          enum:
          - android
          - ios
        app_version:
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^[0-9A-Za-z.+_-]+$
        label:
          type: string
          maxLength: 80
    PhoneChallengeRequest:
      type: object
      additionalProperties: false
      required:
      - phone
      - purpose
      properties:
        phone:
          type: string
          minLength: 8
          maxLength: 40
          description: Formato internacional iniciado em +; normalizado e validado por libphonenumber. Países permitidos
            por configuração.
        purpose: &id002
          type: string
          enum:
          - login
          - link
          - reauth
    OIDCChallengeRequest:
      type: object
      additionalProperties: false
      required:
      - provider
      - purpose
      properties:
        provider:
          type: string
          enum:
          - GOOGLE
          - APPLE
        purpose: *id002
    Challenge:
      type: object
      additionalProperties: false
      required:
      - challenge_id
      - expires_at
      - resend_after_seconds
      properties:
        challenge_id: *id001
        expires_at: &id003
          type: string
          format: date-time
        resend_after_seconds:
          type: integer
          minimum: 0
        nonce:
          type: string
          minLength: 32
          maxLength: 256
          description: Usar exatamente como retornado no request ao provedor. Apple já recebe nonce SHA-256 em hexadecimal;
            não aplicar outro hash.
    PhoneVerifyRequest:
      type: object
      additionalProperties: false
      required:
      - challenge_id
      - code
      - device
      properties:
        challenge_id: *id001
        code:
          type: string
          pattern: ^[0-9]{4,10}$
          writeOnly: true
        device:
          $ref: '#/components/schemas/Device'
    OIDCLoginRequest:
      type: object
      additionalProperties: false
      required:
      - challenge_id
      - id_token
      - device
      properties:
        challenge_id: *id001
        id_token:
          type: string
          minLength: 1
          maxLength: 16384
          writeOnly: true
        device:
          $ref: '#/components/schemas/Device'
    ProviderProof:
      type: object
      additionalProperties: false
      required:
      - provider
      - challenge_id
      - credential
      properties:
        provider: &id004
          type: string
          enum:
          - PHONE
          - GOOGLE
          - APPLE
        challenge_id: *id001
        credential:
          type: string
          minLength: 1
          maxLength: 16384
          writeOnly: true
          description: OTP para PHONE ou ID token para GOOGLE/APPLE. Nunca um subject informado pelo cliente.
    Tokens:
      type: object
      additionalProperties: false
      required:
      - access_token
      - token_type
      - expires_in
      - refresh_token
      - session_id
      - session_expires_at
      properties:
        access_token:
          type: string
          writeOnly: false
          pattern: ^fa_[A-Za-z0-9_-]{43}$
        token_type:
          type: string
          enum:
          - Bearer
        expires_in:
          type: integer
          minimum: 1
        refresh_token:
          type: string
          pattern: ^fr_[0-9a-f-]{36}\.[A-Za-z0-9_-]{43}$
        session_id: *id001
        session_expires_at: *id003
    Profile:
      type: object
      additionalProperties: false
      required:
      - display_name
      - handle
      - avatar_ref
      properties:
        display_name:
          type: string
          maxLength: 80
        handle:
          type: string
          nullable: true
          minLength: 3
          maxLength: 30
          pattern: ^[a-z][a-z0-9_]{2,29}$
        avatar_ref:
          type: string
          format: uuid
          nullable: true
    Me:
      type: object
      additionalProperties: false
      required:
      - id
      - status
      - created_at
      - onboarding_required
      - profile
      properties:
        id: *id001
        status:
          type: string
          enum:
          - active
        created_at: *id003
        onboarding_required:
          type: boolean
        profile:
          $ref: '#/components/schemas/Profile'
    LoginResult:
      type: object
      additionalProperties: false
      required:
      - tokens
      - user
      properties:
        tokens:
          $ref: '#/components/schemas/Tokens'
        user:
          $ref: '#/components/schemas/Me'
    RefreshRequest:
      type: object
      additionalProperties: false
      required:
      - refresh_token
      properties:
        refresh_token:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
    OnboardingRequest:
      type: object
      additionalProperties: false
      required:
      - display_name
      - handle
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 80
        handle:
          type: string
          minLength: 3
          maxLength: 30
          description: Normalização trim + ASCII lowercase. Único e sujeito à reserva. Não permite Unicode/homógrafos.
    Session:
      type: object
      additionalProperties: false
      required:
      - id
      - current
      - created_at
      - expires_at
      - last_used_at
      - device
      properties:
        id: *id001
        current:
          type: boolean
        created_at: *id003
        expires_at: *id003
        last_used_at: *id003
        device:
          $ref: '#/components/schemas/Device'
    SessionList:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Session'
    LinkedIdentity:
      type: object
      additionalProperties: false
      required:
      - id
      - provider
      - verified_at
      properties:
        id: *id001
        provider: *id004
        verified_at: *id003
    IdentityList:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LinkedIdentity'
    AppleNotification:
      type: object
      additionalProperties: false
      required:
      - payload
      properties:
        payload:
          type: string
          minLength: 1
          maxLength: 16384
          writeOnly: true
          description: JWS de notificação Apple. Assinatura, issuer, audience, iat, jti e eventos verificados; nenhum
            segredo compartilhado no URL.
