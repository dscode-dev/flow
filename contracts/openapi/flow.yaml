          - LIVE
          - ENDED
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        published_at:
          type: string
          format: date-time
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        archived_at:
          type: string
          format: date-time
          nullable: true
        version:
          type: integer
          format: int64
          minimum: 1
        details_redacted:
          type: boolean
      required:
